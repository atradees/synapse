name: Synapse Pulse (Auto Update)

on:
  schedule:
    - cron: '0 23,11 * * *' 
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- 1. SETUP PYTHON ---
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # --- 2. INSTALL LIBRARIES (FORCE MODE) ---
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance networkx scikit-learn sentence-transformers python-louvain

      # --- 3. RUN BRAIN ENGINE ---
      - name: Run Processor
        run: |
          python data_engine/processor.py

      # --- 4. SAVE DATA ---
      - name: Commit New Data
        run: |
          git config --global user.name 'Synapse Bot'
          git config --global user.email 'bot@synapse.ai'
          git add web/public/data/brain_data.json
          git commit -m "🧠 Neural Update: Fresh Market Data" || echo "No changes to commit"
          git push

      # --- 5. BUILD WEB ---
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install & Build
        working-directory: ./web
        run: |
          npm install
          npm run build

      # --- 6. DEPLOY ---
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
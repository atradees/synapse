name: Synapse Pulse (Auto Update)

on:
  # Update tiap jam 6 pagi & 6 sore WIB (23:00 & 11:00 UTC)
  schedule:
    - cron: '0 23,11 * * *' 
  # Bisa trigger manual
  workflow_dispatch:
  # Trigger saat push ke main
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- 1. UPDATE DATA (PYTHON) ---
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Python Libs
        run: |
          pip install -r data_engine/requirements.txt

      - name: Run Processor
        run: |
          python data_engine/processor.py

      # --- 2. SIMPAN DATA BARU KE REPO ---
      - name: Commit New Data
        run: |
          git config --global user.name 'Synapse Bot'
          git config --global user.email 'bot@synapse.ai'
          git add web/public/data/brain_data.json
          # Commit hanya jika ada perubahan
          git commit -m "🧠 Neural Update: Fresh Market Data" || echo "No changes to commit"
          git push

      # --- 3. BUILD WEBSITE (REACT) ---
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install & Build
        working-directory: ./web
        run: |
          npm install
          npm run build

      # --- 4. DEPLOY KE GITHUB PAGES ---
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist